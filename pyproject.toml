[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onemap-sg-cli"
version = "0.3.0"
description = "Singapore OneMap CLI — search, geocode, routing, themes, demographics. Output: text (default), JSON (-f json), or raw API (-f raw-json)."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Samuel Cui", email = "i@cui.to"},
]
keywords = ["singapore", "onemap", "geocoding", "routing", "maps", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "click>=8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
onemap = "onemap_sg.cli:main"
onemap-sg-cli = "onemap_sg.cli:main"

[project.urls]
Homepage = "https://github.com/samuelncui/onemap-sg-cli"
Repository = "https://github.com/samuelncui/onemap-sg-cli"

[tool.hatch.build.targets.wheel]
packages = ["onemap_sg"]
